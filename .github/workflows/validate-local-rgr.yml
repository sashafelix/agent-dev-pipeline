name: Validate local RGR contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate-run-bundle.py
      - name: Parse canonical JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('docs/agent/schemas').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
      - name: Validate evaluation corpus shape
        run: |
          grep -q '^version: 1$' docs/agent/evaluation-corpus.yaml
          test "$(grep -c '^  - id:' docs/agent/evaluation-corpus.yaml)" -ge 10

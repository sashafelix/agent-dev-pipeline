name: Validate local RGR contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract tooling
        run: |
          python -m py_compile \
            scripts/schema_validation.py \
            scripts/validate-run-bundle.py \
            scripts/evaluate-corpus.py \
            scripts/resolve-profile.py \
            scripts/validate-governance.py \
            scripts/validate-run-governance.py \
            scripts/validate-pack.py \
            scripts/export-run-bundle.py \
            scripts/verify-export-bundle.py \
            scripts/generate-contract-fixture.py
      - name: Parse all published schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('docs/agent/schemas').glob('*.json'))
          assert paths, 'no schemas found'
          for path in paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              assert schema.get('$schema'), f'{path}: missing $schema'
              assert schema.get('$id'), f'{path}: missing $id'
              print(f'parsed {path}')
          PY
      - name: Validate governance contracts and evaluation corpus
        run: |
          python scripts/validate-governance.py
          python scripts/evaluate-corpus.py
      - name: Validate portable v2 pack
        run: python scripts/validate-pack.py packs/rgr-software-v2/pack.json --hash-report /tmp/pack-hashes.json
      - name: Exercise deterministic profile resolution
        run: |
          cat > /tmp/small.json <<'JSON'
          {"story_id":"CI-SMALL","facts":{"risk_tags":[],"blast_radius":"low","uncertainty":"low","changed_module_count":1,"cross_service":false,"contract_change":false,"data_migration":false,"security_sensitive":false,"infrastructure_change":false}}
          JSON
          python scripts/resolve-profile.py /tmp/small.json --output /tmp/small-resolution.json
          grep -q '"selected_profile": "small"' /tmp/small-resolution.json

          cat > /tmp/high.json <<'JSON'
          {"story_id":"CI-HIGH","facts":{"risk_tags":["domain:auth"],"blast_radius":"medium","uncertainty":"low","changed_module_count":2,"cross_service":false,"contract_change":false,"data_migration":false,"security_sensitive":true,"infrastructure_change":false}}
          JSON
          python scripts/resolve-profile.py /tmp/high.json --output /tmp/high-resolution.json
          grep -q '"selected_profile": "high-risk"' /tmp/high-resolution.json
          grep -q '"threat_modeler"' /tmp/high-resolution.json
      - name: Exercise schema validator reference and failure paths
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from schema_validation import validate_instance
          schema = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['item'],
              'properties': {'item': {'$ref': '#/$defs/name'}},
              '$defs': {'name': {'type': 'string', 'minLength': 2}}
          }
          assert validate_instance({'item': 'ok'}, schema) == []
          assert validate_instance({'item': 'x'}, schema)
          assert validate_instance({'item': 'ok', 'extra': True}, schema)
          print('schema validator reference, positive and negative paths passed')
          PY
      - name: Generate and validate complete run fixture
        run: |
          python scripts/generate-contract-fixture.py /tmp/local-rgr-run
          python scripts/validate-run-bundle.py /tmp/local-rgr-run
          python scripts/validate-run-governance.py /tmp/local-rgr-run
      - name: Export deterministically and verify archive
        run: |
          python scripts/export-run-bundle.py /tmp/local-rgr-run /tmp/evidence-a.tar.gz --manifest-out /tmp/export-manifest.json
          python scripts/export-run-bundle.py /tmp/local-rgr-run /tmp/evidence-b.tar.gz
          cmp /tmp/evidence-a.tar.gz /tmp/evidence-b.tar.gz
          python scripts/verify-export-bundle.py /tmp/evidence-a.tar.gz
      - name: Reject tampered evidence archive
        run: |
          mkdir -p /tmp/tampered
          tar -xzf /tmp/evidence-a.tar.gz -C /tmp/tampered
          printf '\ntampered\n' >> /tmp/tampered/quality-gates.json
          tar -czf /tmp/tampered.tar.gz -C /tmp/tampered .
          if python scripts/verify-export-bundle.py /tmp/tampered.tar.gz; then
            echo 'tampered archive unexpectedly passed' >&2
            exit 1
          fi

name: Validate local RGR contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract tooling
        run: |
          python -m py_compile \
            scripts/schema_validation.py \
            scripts/validate-run-bundle.py \
            scripts/evaluate-corpus.py
      - name: Parse all published schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('docs/agent/schemas').glob('*.json'))
          assert paths, 'no schemas found'
          for path in paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              assert schema.get('$schema'), f'{path}: missing $schema'
              assert schema.get('$id'), f'{path}: missing $id'
              print(f'parsed {path}')
          PY
      - name: Validate canonical evaluation corpus
        run: python scripts/evaluate-corpus.py
      - name: Exercise schema validator failure paths
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from schema_validation import validate_instance
          schema = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['name'],
              'properties': {'name': {'type': 'string', 'minLength': 2}}
          }
          assert validate_instance({'name': 'ok'}, schema) == []
          assert validate_instance({'name': 'x'}, schema)
          assert validate_instance({'name': 'ok', 'extra': True}, schema)
          print('schema validator positive and negative paths passed')
          PY

name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            chore/external-share-polish \
            feature/local-rgr-contracts-v1-2 \
            feature/local-rgr-governance-v1-3 \
            feature/local-rgr-hardening-v1-1 \
            feature/local-rgr-v2-pack-export
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
          done

version: 4
contract_id: local-rgr-v1.2
workflow:
  entrypoint: ai-pipeline-rgr-orchestrator
  stage_order: [prepare, brainstorm, plan, analyze, red_test, green_code, refactor, quality_gate, converge]
  direct_stage_invocation: redirect_to_orchestrator
  canonical_json_is_authoritative: true
  markdown_is_projection: true
  role_separation:
    red_test: test_author
    green_code: implementer
    refactor: refactorer
    quality_gate: independent_verifier
    reviewer_identity_must_differ_from_implementer: true
  convergence:
    max_attempts: 2
    resume_from_earliest_invalid_stage: true
  isolation:
    mode: git_worktree
    path: .agent-runs/{story_id}
    branch: story/{story_id}
    cleanup: manual
artifacts:
  write_once:
    plan-input.md: null
    repository-intelligence.json: repository-intelligence.schema.json
    brainstorm.json: brainstorm.schema.json
    detailed-plan.json: detailed-plan.schema.json
    analysis-report.json: analysis-report.schema.json
  stage_results:
    red-result.json: stage-result.schema.json
    green-result.json: stage-result.schema.json
    refactor-result.json: stage-result.schema.json
  attempt_versioned:
    quality-gates.json: quality-gates.schema.json
    convergence-report.json: convergence-report.schema.json
    context-{stage}.json: context-manifest.schema.json
  append_only:
    - events.jsonl
    - handoff.md
    - decision-log.md
  projections:
    - brainstorm.md
    - detailed-plan.md
    - analysis-report.md
    - quality-gates.md
    - convergence-report.md
  create_on_failure:
    - error-report.md
required_completed_bundle:
  - run-context.md
  - plan-input.md
  - repository-intelligence.json
  - brainstorm.md
  - brainstorm.json
  - detailed-plan.md
  - detailed-plan.json
  - analysis-report.json
  - red-result.json
  - green-result.json
  - refactor-result.json
  - handoff.md
  - quality-gates.md
  - quality-gates.json
  - convergence-report.json
  - decision-log.md
  - events.jsonl
  - context-prepare.json
  - context-brainstorm.json
  - context-plan.json
  - context-analyze.json
  - context-red_test.json
  - context-green_code.json
  - context-refactor.json
  - context-quality_gate.json
  - context-converge.json
stage_exit_requirements:
  prepare:
    - repository intelligence validates and is revision scoped
    - no source files changed
  brainstorm:
    - every input item maps to at least one declarative success criterion
    - no blocking uncertainty remains
  plan:
    - task dependency graph is acyclic
    - every criterion maps to planned tests
    - status is locked
  analyze:
    - zero hard findings
    - zero unresolved correctness uncertainties
  red_test:
    - actor_role is test_author
    - every criterion has red_confirmed evidence
  green_code:
    - actor_role is implementer
    - every criterion has passing evidence
  refactor:
    - actor_role is refactorer
    - every criterion remains passing
  quality_gate:
    - reviewer_role is independent_verifier
    - reviewer identity differs from implementer
    - every criterion has independently verified evidence
  converge:
    - CONVERGED has zero blocking gaps and no earliest invalid stage
failure_policy:
  halt_on_any_stage_failure: true
  retry_max: 1
  retry_allowed_for: [transient_tooling, flaky_test_container_startup]
  retry_forbidden_for: [assertion_failure, compile_error, schema_violation, evidence_violation, security_violation, contract_violation, self_check_incomplete]
  error_report_required: true
  preserve_worktree: true
validation:
  run_bundle: python3 scripts/validate-run-bundle.py docs/agent/runs/{story_id}
  evaluation_corpus: python3 scripts/evaluate-corpus.py

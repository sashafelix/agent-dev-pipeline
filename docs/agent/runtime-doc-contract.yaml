version: 2
workflow:
  entrypoint: ai-pipeline-rgr-orchestrator
  stage_order:
    - brainstorm
    - red_test
    - green_code
    - refactor
    - quality_gate
  direct_stage_invocation: redirect_to_orchestrator
  isolation:
    mode: git_worktree
    path: .agent-runs/{story_id}
    branch: story/{story_id}
    cleanup: manual  # operator-driven; agents never auto-delete worktrees
writes:
  replace_in_place:
    - docs/agent/runs/{story_id}/run-context.md
    - docs/agent/runs/{story_id}/detailed-plan.md  # pre-RED only; locked once RED starts
    - docs/agent/runs/{story_id}/quality-gates.md
    - docs/agent/learnings.md
    - docs/agent/current-run.md
  write_once:
    - docs/agent/runs/{story_id}/plan-input.md
    - docs/agent/runs/{story_id}/brainstorm.md
  append_only:
    - docs/agent/runs/{story_id}/handoff.md
    - docs/agent/runs/{story_id}/decision-log.md
  append_only_exception:
    description: >
      The orchestrator may delete a partial stage section from handoff.md ONLY
      during an explicit documented resume (see orchestrator Resume Policy).
      The action must be logged in decision-log.md.
  create_on_failure:
    - docs/agent/runs/{story_id}/error-report.md
required_story_docs:
  - docs/agent/runs/{story_id}/run-context.md
  - docs/agent/runs/{story_id}/plan-input.md
  - docs/agent/runs/{story_id}/brainstorm.md
  - docs/agent/runs/{story_id}/detailed-plan.md
  - docs/agent/runs/{story_id}/handoff.md
  - docs/agent/runs/{story_id}/quality-gates.md
  - docs/agent/runs/{story_id}/decision-log.md
stage_exit_requirements:
  brainstorm:
    - brainstorm.md with all 5 lenses populated
    - every Jira AC mapped to at least one declarative SC
    - handoff.md BRAINSTORM section with self-check block
  red_test:
    - failing tests for every SC (trace matrix)
    - handoff.md RED section with comprehension evidence + self-check block
  green_code:
    - all RED tests passing; no regression
    - handoff.md GREEN section with comprehension + checkpoints + self-check block
  refactor:
    - all tests still green; no behavior drift
    - handoff.md REFACTOR section with comprehension + checkpoints + self-check block
  quality_gate:
    - quality-gates.md with explicit PASS | FAIL | WARN verdict
    - SC-to-test trace complete
    - hard-FAIL checklist: all unchecked
    - decision-index.md updated
failure_policy:
  halt_on_any_stage_failure: true
  retry_max: 1
  retry_allowed_for: [transient_tooling, flaky_test_container_startup]
  retry_forbidden_for: [assertion_failure, compile_error, self_check_incomplete, security_violation, contract_violation]
  error_report_required: true
  preserve_worktree: true
